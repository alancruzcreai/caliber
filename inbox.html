<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="caliber-page" content="inbox|Inbox & Qualify" />
<title>Caliber · Inbox & Qualify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .inbox-list__title { font-family: var(--font-display); font-size: var(--text-2xl); font-weight: 400; letter-spacing: -0.02em; margin: 0 0 var(--s-3); }
  .inbox-list__title em { font-style: normal; color: var(--gold); }
  .ilead__channel { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; color: var(--ink-quiet); text-transform: uppercase; }
  .kw-chip { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.08em; background: var(--info-tint); color: var(--info); padding: 1px 5px; border-radius: var(--r-sm); }
  .triage__rec { margin-top: var(--s-5); padding: var(--s-4); border-radius: var(--r-md); font-size: var(--text-sm); line-height: 1.5; }
  .triage__rec--hot { background: var(--success-tint); color: var(--success); }
  .triage__rec--warm { background: var(--gold-tint); color: var(--gold-deep); }
  .triage__rec--cold { background: var(--surface-2); color: var(--ink-mute); }
  .compose { display: flex; gap: var(--s-2); align-items: flex-end; }
  .compose textarea { flex: 1; resize: none; min-height: 42px; }
  /* mobile: show chat only */
  @media (max-width: 1024px) { .inbox-shell { grid-template-columns: 320px 1fr; } .triage { display: none; } }
  @media (max-width: 768px)  {
    .inbox-shell { grid-template-columns: 1fr; height: auto; }
    .inbox-list { display: none; }
    .inbox-main { min-height: calc(100vh - 61px); }
    .inbox-main__head { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div id="page-content">
<div class="content content--flush">
<div class="inbox-shell">

  <!-- LEFT: lead list -->
  <aside class="inbox-list reveal">
    <div class="inbox-list__head">
      <h2 class="inbox-list__title">In<em>box</em></h2>
      <div class="flex gap-2" style="flex-wrap:wrap">
        <span class="mono text-xs text-quiet" id="leadCount"></span>
        <button class="filter-chip filter-chip--active" data-f="all">All</button>
        <button class="filter-chip" data-f="hot">Hot</button>
        <button class="filter-chip" data-f="warm">Warm</button>
        <button class="filter-chip" data-f="cold">Cold</button>
      </div>
      <div class="mono text-xs text-quiet" style="margin-top:var(--s-2)">via ManyChat · WhatsApp + IG DM</div>
    </div>
    <div class="inbox-list__body" id="leadList"></div>
  </aside>

  <!-- CENTER: conversation -->
  <section class="inbox-main reveal reveal-1">
    <header class="inbox-main__head" id="chatHead"></header>
    <div class="inbox-main__body" id="chatBody"></div>
    <footer class="inbox-main__footer" id="chatFooter"></footer>
  </section>

  <!-- RIGHT: triage -->
  <aside class="triage reveal reveal-2" id="triagePanel"></aside>

</div>
</div>
</div>

<script src="assets/data.js"></script>
<script src="assets/ai.js"></script>
<script src="assets/app.js"></script>
<script>
  const LEADS = window.CALIBER_DATA.inbox;
  let activeId = LEADS[0].id;
  let filter = 'all';

  const flagFor = (lang) => lang === 'ES' ? '🇲🇽' : '🇬🇧';
  const tempClass = (s) => s === 'hot' ? 'hot' : s === 'warm' ? 'warm' : 'cold';

  function renderList() {
    const shown = LEADS.filter(l => filter === 'all' || l.status === filter);
    document.getElementById('leadCount').textContent = shown.length + ' leads';
    document.getElementById('leadList').innerHTML = shown.map(l => `
      <div class="ilead ${l.id === activeId ? 'ilead--active' : ''}" onclick="selectLead('${l.id}')">
        <div class="ilead__name"><span class="dot dot--${tempClass(l.status)}"></span>${l.name} <span style="opacity:.6">${flagFor(l.lang)}</span></div>
        <div class="ilead__time">${l.timeAgo}</div>
        <div class="ilead__preview">${l.lastMsg}</div>
        <div class="ilead__meta">
          <span class="score-pill score-pill--${tempClass(l.status)}">${l.score}</span>
          <span class="kw-chip">${l.keyword}</span>
          <span class="ilead__channel">${l.channel}</span>
          ${l.unread ? `<span class="score-pill score-pill--warm" style="margin-left:auto">${l.unread}</span>` : ''}
        </div>
      </div>`).join('');
  }

  function selectLead(id) {
    activeId = id;
    renderList();
    renderChat();
    renderTriage();
  }
  window.selectLead = selectLead;

  function lead() { return LEADS.find(l => l.id === activeId); }

  function renderChat() {
    const l = lead();
    document.getElementById('chatHead').innerHTML = `
      <div>
        <div class="display" style="font-size:var(--text-lg);font-weight:500">${l.name} <span style="opacity:.6">${flagFor(l.lang)}</span></div>
        <div class="mono text-xs text-quiet">${l.handle} · ${l.vertical} · ${l.channel}</div>
      </div>
      <div class="flex gap-2 items-center">
        <span class="kw-chip">kw: ${l.keyword}</span>
        <span class="score-pill score-pill--${tempClass(l.status)}">${l.status.toUpperCase()} ${l.score}</span>
      </div>`;

    document.getElementById('chatBody').innerHTML = `
      <div class="conv-day-divider" style="text-align:center;margin:var(--s-2) 0"><span class="mono text-xs text-quiet">Keyword "${l.keyword}" detected → flow started</span></div>
      ${l.thread.map(m => `
        <div class="conv-msg-group conv-msg-group--${m.who === 'ai' ? 'ai' : 'lead'}" style="display:flex;flex-direction:column;max-width:74%;${m.who === 'ai' ? 'align-self:flex-start' : 'align-self:flex-end;align-items:flex-end'}">
          <div class="bubble bubble--${m.who === 'ai' ? 'ai' : 'lead'}">${m.text}</div>
          <div class="bubble__meta">${m.who === 'ai' ? 'Agent · ' : ''}${m.t}</div>
        </div>`).join('')}
      <div id="copilotMount"></div>`;
    document.getElementById('chatBody').scrollTop = document.getElementById('chatBody').scrollHeight;

    // footer compose
    document.getElementById('chatFooter').innerHTML = `
      <div id="copilotBox"></div>
      <div class="compose">
        <textarea class="input" id="composer" placeholder="Write a reply… (or use the AI suggestion above)"></textarea>
        <button class="btn btn--primary" onclick="calToast('Sent (mock) — human-approved')">Send</button>
      </div>
      <div class="mono text-xs text-quiet" style="margin-top:6px">Human approves before anything sends. The agent never messages on its own.</div>`;

    loadCopilot();
  }

  // AI: conversation copilot
  async function loadCopilot() {
    const box = document.getElementById('copilotBox');
    box.innerHTML = `<div class="copilot"><div class="copilot__label">✶ Copilot is drafting…</div></div>`;
    const r = await window.aiSuggestNextMessage(lead());
    box.innerHTML = `
      <div class="copilot">
        <div class="copilot__label">✶ Suggested reply · Sebastian's voice</div>
        <div class="copilot__text">"${r.suggestion}"</div>
        <div class="copilot__why">Why: ${r.why}</div>
        <div class="copilot__rules">${r.rules.map(rule => `<span class="copilot__rule">${rule}</span>`).join('')}</div>
        <div class="copilot__actions">
          <button class="btn btn--gold btn--sm" onclick="useSuggestion(${JSON.stringify(r.suggestion).replace(/"/g,'&quot;')})">Use suggestion</button>
          <button class="btn btn--ghost btn--sm" onclick="loadCopilot()">Regenerate</button>
        </div>
      </div>`;
  }
  window.loadCopilot = loadCopilot;
  window.useSuggestion = function (text) {
    document.getElementById('composer').value = text;
    document.getElementById('composer').focus();
    calToast('Loaded into composer — review, then send');
  };

  // AI: triage scoring
  async function renderTriage() {
    const panel = document.getElementById('triagePanel');
    panel.innerHTML = `<div class="eyebrow mb-4">— Triage · AI</div><div class="text-mute text-sm">Scoring…</div>`;
    const t = await window.aiScoreLeadTriage(lead());
    panel.innerHTML = `
      <div class="eyebrow mb-4">— Triage · AI</div>
      <div class="triage__score-wrap">
        <div class="display" style="font-size:var(--text-4xl);color:${t.temp==='hot'?'var(--ink)':t.temp==='warm'?'var(--gold)':'var(--ink-quiet)'}">${t.score}<span class="mono text-xs text-quiet">/100</span></div>
        <div class="mono text-xs" style="margin-top:6px;text-transform:uppercase;letter-spacing:0.12em;color:var(--ink-mute)">${t.temp}</div>
      </div>
      <div class="ctx-section__label" style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-quiet);margin-bottom:var(--s-3)">Score axes</div>
      <div class="triage__axes">
        ${t.axes.map(ax => `
          <div class="triage__axis-row">
            <div class="triage__axis-head"><span>${ax.key}</span><span class="mono text-quiet">${ax.value}</span></div>
            <div class="triage__axis-track"><div class="triage__axis-fill" style="width:${ax.value}%;background:${ax.value>=70?'var(--ink)':ax.value>=50?'var(--gold)':'var(--ink-faint)'}"></div></div>
          </div>`).join('')}
      </div>
      <div class="ctx-section__label" style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-quiet);margin:var(--s-6) 0 var(--s-2)">Why this score</div>
      <div class="text-sm" style="line-height:1.5;color:var(--ink-soft)">${t.reason}</div>
      <div class="triage__rec triage__rec--${t.temp}">${t.recommendation}</div>
      ${t.temp === 'hot'
        ? `<button class="btn btn--success w-full mt-4" onclick="calToast('Lead handed to Sebastian — booking offered')">Hand to Sebastian →</button>`
        : t.temp === 'warm'
        ? `<button class="btn btn--ghost w-full mt-4" onclick="calToast('Kept in nurture')">Keep nurturing</button>`
        : `<button class="btn btn--ghost w-full mt-4" onclick="calToast('Sent free resources, archived')">Send resources & archive</button>`}
      <div class="mono text-xs text-quiet mt-4" style="text-align:center">// INTEGRATION POINT: ManyChat</div>`;
  }

  renderList();
  renderChat();
  renderTriage();
</script>
</body>
</html>
