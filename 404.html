<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Caliber · Not found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .not-found {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--s-8);
    position: relative;
    overflow: hidden;
  }
  .not-found__bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 30% 40%, rgba(184,145,90,0.12), transparent 60%),
      radial-gradient(ellipse at 70% 70%, rgba(184,145,90,0.06), transparent 50%);
  }
  .not-found__inner { text-align: center; position: relative; max-width: 560px; }
  .not-found__num {
    font-family: var(--font-display);
    font-size: 200px;
    line-height: 1;
    color: var(--ink);
    font-weight: 300;
    letter-spacing: -0.06em;
    margin: 0;
    font-style: normal;
  }
  .not-found__num em { color: var(--gold); font-style: normal; }
  .not-found__line {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-quiet);
    margin: var(--s-3) 0 var(--s-6);
  }
  .not-found__msg {
    font-family: var(--font-display);
    font-size: var(--text-2xl);
    color: var(--ink);
    font-weight: 400;
    margin: 0 0 var(--s-8);
    line-height: 1.3;
    letter-spacing: -0.02em;
  }
  .not-found__msg em { font-style: normal; color: var(--gold); font-weight: 300; }
</style>
</head>
<body>
<div class="not-found">
  <div class="not-found__bg"></div>
  <div class="not-found__inner">
    <h1 class="not-found__num">4<em>04</em></h1>
    <div class="not-found__line">— Page not in this console</div>
    <p class="not-found__msg">
      That route doesn't exist yet. <em>Yet.</em>
    </p>
    <div class="flex gap-3" style="justify-content:center">
      <a href="index.html" class="btn btn--primary">Back to dashboard</a>
      <button class="btn btn--ghost" onclick="window.openCmdk && window.openCmdk()">Open command palette · ⌘K</button>
    </div>
  </div>
</div>
<script src="assets/app.js"></script>
</body>
</html>
